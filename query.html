<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人申報查詢｜證照積分統計系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="./css/styles.css" rel="stylesheet">
</head>
<body class="p-2 md:p-10 text-slate-800">
    <div class="max-w-3xl mx-auto">
        <header class="mb-8 flex items-center gap-4">
            <div class="bg-blue-600 p-4 rounded-3xl shadow-xl text-white">
                <i class="fa-solid fa-magnifying-glass text-3xl"></i>
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-black tracking-tight">個人申報查詢頁</h1>
                <p class="text-slate-500 font-bold italic underline decoration-blue-500 underline-offset-4 uppercase text-[10px]">Personal Lookup Only</p>
            </div>
        </header>

        <section class="glass-card p-6 md:p-10 shadow-xl mb-8 border-t-8 border-blue-600">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">姓名</label>
                    <input type="text" id="lookupName" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 focus:border-blue-500 outline-none" placeholder="請輸入姓名">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">身分證末三碼</label>
                    <input type="text" id="lookupIdLast3" maxlength="3" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 focus:border-blue-500 outline-none" placeholder="例如 789">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">查詢碼</label>
                    <input type="text" id="lookupQueryCode" maxlength="4" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 focus:border-blue-500 outline-none" placeholder="例如 0000">
                </div>
            </div>
            <div class="mt-8 flex flex-col items-center gap-3">
                <button id="lookupSubmitBtn" onclick="lookupSubmission()" class="w-full md:w-auto bg-slate-900 hover:bg-blue-600 text-white px-12 py-4 rounded-[2.5rem] font-black text-lg shadow-2xl transition-all">
                    <i class="fa-solid fa-magnifying-glass-chart mr-2"></i> 查詢個人資料
                </button>
                <p id="lookupLoadingText" class="text-xs text-blue-600 font-bold hidden">查詢中，請稍候...</p>
                <p class="text-xs text-slate-500">僅可查詢本人資料，請輸入姓名、身分證末三碼與查詢碼；查詢碼為你申報時設定的 4 碼數字。</p>
            </div>
        </section>

        <section id="lookupResult" class="glass-card p-6 md:p-10 shadow-xl hidden border-t-8 border-emerald-600">
            <h2 class="text-xl font-black mb-6">查詢結果</h2>
            <div class="space-y-3 text-sm text-slate-700">
                <p><strong>姓名：</strong><span id="resultName">—</span></p>
                <p><strong>單位：</strong><span id="resultUnit">—</span></p>
                <p><strong>送出時間：</strong><span id="resultSubmittedAt">—</span></p>
                <p><strong>總分：</strong><span id="resultScore">—</span></p>
                <p><strong>升遷資格：</strong><span id="resultEligibility">—</span></p>
                <p><strong>提醒：</strong><span id="resultEligibilityMessage">—</span></p>
                <div>
                    <strong>必要資格檢核：</strong>
                    <div id="resultRequiredQualifications" class="mt-2 space-y-2"></div>
                </div>
                <div>
                    <strong>採計結果摘要：</strong>
                    <div id="resultSummary" class="mt-2 space-y-2"></div>
                </div>
            </div>
        </section>

        <div class="mt-8 text-center">
            <a href="./admin-dashboard.html" class="text-sm text-slate-500 hover:text-blue-600 font-bold underline underline-offset-4">
                管理者查詢
            </a>
        </div>
    </div>

    <script>
        const LOOKUP_API_URL = "https://script.google.com/macros/s/AKfycbztutbQDNYh_tSGkLWYqYZIkaV7OD4bfghwVgOlxCAY9l4isn_ogvog_Mmn9WfMipUG/exec";

        async function lookupSubmission() {
            const name = document.getElementById('lookupName').value.trim();
            const idLast3 = document.getElementById('lookupIdLast3').value.trim();
            const queryCode = document.getElementById('lookupQueryCode').value.trim();
            const btn = document.getElementById('lookupSubmitBtn');
            const loadingText = document.getElementById('lookupLoadingText');

            if (!name || !/^\d{3}$/.test(idLast3) || !/^\d{4}$/.test(queryCode)) {
                alert('請完整輸入姓名、身分證末三碼與 4 碼查詢碼。');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> 查詢中...';
            loadingText.classList.remove('hidden');

            try {
                const url = `${LOOKUP_API_URL}?action=lookup&name=${encodeURIComponent(name)}&idLast3=${encodeURIComponent(idLast3)}&queryCode=${encodeURIComponent(queryCode)}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.result !== 'success') {
                    alert(data.message || '查無符合資料，請確認輸入資訊是否正確');
                    return;
                }

                document.getElementById('resultName').innerText = data.data.name || '—';
                document.getElementById('resultUnit').innerText = data.data.unit || '—';
                document.getElementById('resultSubmittedAt').innerText = data.data.submittedAt || '—';
                document.getElementById('resultScore').innerText = data.data.totalScore || '0';
                document.getElementById('resultEligibility').innerText = data.data.eligibility || '—';
                document.getElementById('resultEligibilityMessage').innerText = data.data.eligibilityMessage || '—';

                const required = document.getElementById('resultRequiredQualifications');
                required.innerHTML = '';

                if (Array.isArray(data.data.requiredQualifications) && data.data.requiredQualifications.length > 0) {
                    data.data.requiredQualifications.forEach(item => {
                        const hasRealFileUrl = item.fileUrl && item.fileUrl !== '無' && item.fileUrl !== '未上傳' && /^https?:\/\//.test(item.fileUrl);
                        required.innerHTML += `
                            <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-2">
                                <div class="flex justify-between gap-4">
                                    <span>${item.label}：<b>${item.certName || '未檢附'}</b></span>
                                    <span class="${item.status === '已檢附' ? 'text-emerald-600' : 'text-amber-700'} font-black">${item.status || '未判定'}</span>
                                </div>
                                ${hasRealFileUrl ? `<div><a href="${item.fileUrl}" target="_blank" rel="noopener noreferrer" class="text-sm text-blue-600 font-bold underline underline-offset-2">查看附件</a></div>` : ''}
                            </div>
                        `;
                    });
                } else {
                    required.innerHTML = '<div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-slate-500">目前未提供必要資格附件明細。</div>';
                }

                const summary = document.getElementById('resultSummary');
                summary.innerHTML = '';

                (data.data.categories || []).forEach(item => {
                    const hasRealFileUrl = item.fileUrl && item.fileUrl !== '無' && item.fileUrl !== '未上傳' && /^https?:\/\//.test(item.fileUrl);
                    const displayName = item.category === 'fire' && item.certName === '無相關證照' ? '火災搶救初級班' : item.certName;
                    summary.innerHTML += `
                        <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-2">
                            <div class="flex justify-between gap-4">
                                <span>${item.category}：<b>${displayName}</b></span>
                                <span class="text-blue-600 font-black">+${Number(item.score).toFixed(2)}</span>
                            </div>
                            ${hasRealFileUrl ? `<div><a href="${item.fileUrl}" target="_blank" rel="noopener noreferrer" class="text-sm text-blue-600 font-bold underline underline-offset-2">查看附件</a></div>` : ''}
                        </div>
                    `;
                });

                document.getElementById('lookupResult').classList.remove('hidden');
            } catch (err) {
                alert('查詢失敗，請稍後再試。');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-magnifying-glass-chart mr-2"></i> 查詢個人資料';
                loadingText.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
