<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理者查詢｜證照積分統計系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="./css/styles.css" rel="stylesheet">
</head>
<body class="p-2 md:p-10 text-slate-800">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8 flex items-center gap-4">
            <div class="bg-slate-900 p-4 rounded-3xl shadow-xl text-white">
                <i class="fa-solid fa-user-shield text-3xl"></i>
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-black tracking-tight">管理者查詢頁</h1>
                <p class="text-slate-500 font-bold italic underline decoration-slate-500 underline-offset-4 uppercase text-[10px]">Admin Lookup Dashboard</p>
            </div>
        </header>

        <section class="glass-card p-6 md:p-10 shadow-xl mb-8 border-t-8 border-slate-900">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 items-end">
                <div class="md:col-span-2">
                    <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">管理者金鑰</label>
                    <div class="relative">
                        <input type="password" id="adminKey" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 pr-12 focus:border-slate-700 outline-none" placeholder="請輸入管理者查詢金鑰">
                        <button type="button" onclick="toggleAdminKeyVisibility()" class="absolute inset-y-0 right-0 px-4 text-slate-500 hover:text-blue-600 transition" aria-label="切換管理者金鑰顯示狀態">
                            <i id="adminKeyToggleIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <button id="loadAdminListBtn" onclick="loadAdminList()" class="w-full bg-slate-900 hover:bg-blue-600 text-white px-8 py-4 rounded-[2.5rem] font-black text-lg shadow-2xl transition-all">
                        <i class="fa-solid fa-list mr-2"></i> 載入全部人員
                    </button>
                </div>
            </div>
            <p id="adminListLoadingText" class="text-sm text-blue-600 font-bold mt-4 hidden">載入人員資料中，請稍候...</p>
            <p class="text-xs text-slate-500 mt-4">輸入管理者金鑰後，可查看全部申報人員，再點選查看詳細資料。</p>
        </section>

        <section id="adminListSection" class="glass-card p-6 md:p-10 shadow-xl mb-8 hidden border-t-8 border-blue-600">
            <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-xl font-black">人員列表</h2>
                    <span id="adminListCount" class="text-sm text-slate-500 font-bold">0 筆</span>
                </div>
                <div class="w-full md:w-72">
                    <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">單位篩選</label>
                    <select id="unitFilter" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 focus:border-blue-500 outline-none" onchange="renderAdminList()">
                        <option value="">全部單位</option>
                        <option value="局">局</option>
                        <option value="第一大隊">第一大隊</option>
                        <option value="第二大隊">第二大隊</option>
                        <option value="第三大隊">第三大隊</option>
                        <option value="第四大隊">第四大隊</option>
                    </select>
                </div>
            </div>
            <div id="adminList" class="space-y-3"></div>
        </section>

        <section id="adminDetailSection" class="glass-card p-6 md:p-10 shadow-xl hidden border-t-8 border-emerald-600">
            <h2 class="text-xl font-black mb-6">查詢明細</h2>
            <div class="space-y-3 text-sm text-slate-700">
                <p><strong>姓名：</strong><span id="detailName">—</span></p>
                <p><strong>單位：</strong><span id="detailUnit">—</span></p>
                <p><strong>送出時間：</strong><span id="detailSubmittedAt">—</span></p>
                <p><strong>總分：</strong><span id="detailScore">—</span></p>
                <p><strong>升遷資格：</strong><span id="detailEligibility">—</span></p>
                <p><strong>提醒：</strong><span id="detailEligibilityMessage">—</span></p>
                <div>
                    <strong>採計結果摘要：</strong>
                    <p id="adminDetailLoadingText" class="mt-2 text-sm text-blue-600 font-bold hidden">查詢明細中，請稍候...</p>
                    <div id="detailSummary" class="mt-2 space-y-2"></div>
                </div>
            </div>
        </section>
    </div>

    <script src="./js/config.js"></script>
    <script>
        const LOOKUP_API_URL = "https://script.google.com/macros/s/AKfycbxyLeHBLhUVxVqjoTBevwx4mIO9xk_auUPkJKnvR2jfISvJLeQ0D5ASclSJHvdzb4LoWw/exec";
        const QUERY_REQUIRED_RULES = {
            rescue: ['救助隊訓練(320小時)'],
            fire: ['火災搶救教官班', '火災搶救初級班'],
            drive: ['聯結車駕照', '大貨(客)車駕照']
        };
        let adminRows = [];

        function inferEligibilityFromCategories(categories = []) {
            const names = new Set(categories.map(item => item.certName).filter(Boolean));
            const rescueOk = QUERY_REQUIRED_RULES.rescue.some(name => names.has(name));
            const fireOk = QUERY_REQUIRED_RULES.fire.some(name => names.has(name));
            const driveOk = QUERY_REQUIRED_RULES.drive.some(name => names.has(name));
            const missing = [];
            if (!rescueOk) missing.push('救助隊訓練(320小時)');
            if (!fireOk) missing.push('火災搶救必要證照');
            if (!driveOk) missing.push('車輛駕駛必要證照');
            return {
                eligibility: missing.length === 0 ? '符合' : '不符合',
                message: missing.length === 0 ? '必要證照已檢附完成。' : `未檢附必要證照資料：${missing.join('、')}`
            };
        }

        function getAdminKey() {
            return document.getElementById('adminKey').value.trim();
        }

        function toggleAdminKeyVisibility() {
            const input = document.getElementById('adminKey');
            const icon = document.getElementById('adminKeyToggleIcon');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        }

        function getGroupUnit(item) {
            const unit = (item.unit || '').trim();
            if (!unit) return '局';

            if (Object.prototype.hasOwnProperty.call(AUDIT_UNITS, unit)) {
                return unit;
            }

            for (const brigadeName in AUDIT_UNITS) {
                const medMap = AUDIT_UNITS[brigadeName] || {};
                for (const medName in medMap) {
                    if (medName === unit) return brigadeName;
                    const smallUnits = medMap[medName] || [];
                    if (smallUnits.includes(unit)) return brigadeName;
                }
            }

            return '局';
        }

        function renderAdminList() {
            const list = document.getElementById('adminList');
            const count = document.getElementById('adminListCount');
            const selectedUnit = document.getElementById('unitFilter').value;
            const filteredRows = selectedUnit ? adminRows.filter(item => getGroupUnit(item) === selectedUnit) : adminRows;

            list.innerHTML = '';
            count.innerText = `${filteredRows.length} 筆`;

            if (filteredRows.length === 0) {
                list.innerHTML = '<div class="p-4 rounded-xl bg-slate-50 border border-slate-100 text-slate-500">目前沒有符合條件的資料。</div>';
                return;
            }

            filteredRows.forEach(item => {
                const card = document.createElement('div');
                card.className = 'p-4 bg-slate-50 rounded-2xl border border-slate-100 flex flex-col md:flex-row md:items-center md:justify-between gap-4';
                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="text-lg font-black text-slate-900">${item.name || '—'}</div>
                        <div class="text-sm text-slate-600">單位：${item.unit || '—'}</div>
                        <div class="text-sm text-slate-500">送出時間：${item.submittedAt || '—'}</div>
                    </div>
                    <div class="flex flex-col items-start md:items-end gap-2">
                        <div class="text-blue-600 font-black text-xl">總分 ${item.totalScore || '0.00'}</div>
                        <button class="bg-slate-900 hover:bg-blue-600 text-white px-5 py-2 rounded-full font-bold transition-all">查看詳細</button>
                    </div>
                `;

                card.querySelector('button').addEventListener('click', () => {
                    loadAdminDetail(item);
                });

                list.appendChild(card);
            });
        }

        async function loadAdminList() {
            const adminKey = getAdminKey();
            const btn = document.getElementById('loadAdminListBtn');
            const loadingText = document.getElementById('adminListLoadingText');
            if (!adminKey) {
                alert('請輸入管理者金鑰。');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> 載入中...';
            loadingText.classList.remove('hidden');

            try {
                const url = `${LOOKUP_API_URL}?action=lookup&mode=admin&view=list&adminKey=${encodeURIComponent(adminKey)}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.result !== 'success') {
                    alert(data.message || '載入人員列表失敗');
                    return;
                }

                adminRows = data.data || [];
                renderAdminList();
                document.getElementById('adminListSection').classList.remove('hidden');
            } catch (err) {
                alert('載入人員列表失敗，請稍後再試。');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-list mr-2"></i> 載入全部人員';
                loadingText.classList.add('hidden');
            }
        }

        async function loadAdminDetail(item) {
            const adminKey = getAdminKey();
            const loadingText = document.getElementById('adminDetailLoadingText');
            if (!adminKey) {
                alert('請先輸入管理者金鑰。');
                return;
            }

            loadingText.classList.remove('hidden');
            document.getElementById('adminDetailSection').classList.remove('hidden');

            try {
                const idCardParam = item.idCard ? `&idCard=${encodeURIComponent(item.idCard)}` : '';
                const nameParam = item.name ? `&name=${encodeURIComponent(item.name)}` : '';
                const url = `${LOOKUP_API_URL}?action=lookup&mode=admin&view=detail&adminKey=${encodeURIComponent(adminKey)}${idCardParam || nameParam}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.result !== 'success') {
                    alert(data.message || '載入明細失敗');
                    return;
                }

                document.getElementById('detailName').innerText = data.data.name || '—';
                document.getElementById('detailUnit').innerText = data.data.unit || '—';
                document.getElementById('detailSubmittedAt').innerText = data.data.submittedAt || '—';
                document.getElementById('detailScore').innerText = data.data.totalScore || '0';

                const categories = data.data.categories || [];
                const hasUsableEligibility = data.data.eligibility && data.data.eligibility !== '未判定';
                const inferred = inferEligibilityFromCategories(categories);
                document.getElementById('detailEligibility').innerText = hasUsableEligibility ? data.data.eligibility : inferred.eligibility;
                document.getElementById('detailEligibilityMessage').innerText = hasUsableEligibility
                    ? (data.data.eligibilityMessage || '—')
                    : inferred.message;

                const summary = document.getElementById('detailSummary');
                summary.innerHTML = '';

                categories.forEach(detail => {
                    const hasRealFileUrl = detail.fileUrl && detail.fileUrl !== '無' && detail.fileUrl !== '未上傳' && /^https?:\/\//.test(detail.fileUrl);
                    const displayName = detail.certName;
                    summary.innerHTML += `
                        <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-2">
                            <div class="flex justify-between gap-4">
                                <span>${detail.category}：<b>${displayName}</b></span>
                                <span class="text-blue-600 font-black">+${Number(detail.score).toFixed(2)}</span>
                            </div>
                            ${hasRealFileUrl ? `<div><a href="${detail.fileUrl}" target="_blank" rel="noopener noreferrer" class="text-sm text-blue-600 font-bold underline underline-offset-2">查看附件</a></div>` : ''}
                        </div>
                    `;
                });

                document.getElementById('adminDetailSection').classList.remove('hidden');
                document.getElementById('adminDetailSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
            } catch (err) {
                alert('載入明細失敗，請稍後再試。');
            } finally {
                loadingText.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
